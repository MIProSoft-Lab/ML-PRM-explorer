# The stages of the research that produced the PRM, in order.
timeline:
  - title:
      en: Systematic literature review
      es: Revisión sistemática de la literatura
      ca: Revisió sistemàtica de la literatura
    text:
      en: Collected the ML lifecycle models proposed in academic and industrial sources and extracted the processes that compose them.
      es: Recopiló los modelos de ciclo de vida de ML propuestos en fuentes académicas e industriales y extrajo los procesos que los componen.
      ca: Va recopilar els models de cicle de vida de ML proposats en fonts acadèmiques i industrials i en va extreure els processos que els componen.
  - title:
      en: Comparison with the standards
      es: Comparación con las normas
      ca: Comparació amb les normes
    text:
      en: Mapped those processes against ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 and ISO/IEC 5338, to see where both sources agree and where they differ.
      es: Contrastó esos procesos con ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, para ver dónde coinciden ambas fuentes y dónde difieren.
      ca: Va contrastar aquests processos amb ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, per veure on coincideixen les dues fonts i on difereixen.
  - title:
      en: PRM v1
      es: PRM v1
      ca: PRM v1
    text:
      en: Specified each process with its purpose, outcomes, activities, inputs and outputs, following ISO/IEC 33004 and ISO/IEC/IEEE 24774.
      es: Especificó cada proceso con su propósito, resultados, actividades, entradas y salidas, siguiendo ISO/IEC 33004 e ISO/IEC/IEEE 24774.
      ca: Va especificar cada procés amb el seu propòsit, resultats, activitats, entrades i sortides, seguint ISO/IEC 33004 i ISO/IEC/IEEE 24774.
  - title:
      en: Expert workshop
      es: Taller de expertos
      ca: Taller d'experts
    text:
      en: Practitioners from different areas of the ML lifecycle reviewed the processes of the first version.
      es: Profesionales de distintas áreas del ciclo de vida del ML revisaron los procesos de la primera versión.
      ca: Professionals de diferents àrees del cicle de vida del ML van revisar els processos de la primera versió.
  - title:
      en: PRM v2
      es: PRM v2
      ca: PRM v2
    text:
      en: Refined the processes with the feedback of the workshop. It is the current version of the PRM.
      es: Refinó los procesos con las aportaciones del taller. Es la versión actual del PRM.
      ca: Va refinar els processos amb les aportacions del taller. És la versió actual del PRM.
