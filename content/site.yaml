title:
  en: MLProcessMap
  es: MLProcessMap
  ca: MLProcessMap
author: Antonio Crespí Tobeña
email: antonio.crespi@uib.eu
institution: Universitat de les Illes Balears
intro:
  en: >-
    A Process Reference Model (PRM) for the Machine Learning lifecycle. Following ISO/IEC 33004 and
    ISO/IEC/IEEE 24774, it focuses on the technical processes group and specifies each process with its
    purpose, outcomes, activities, inputs, and outputs. It keeps the names and structure of ISO/IEC/IEEE
    12207, ISO/IEC/IEEE 15288, and ISO/IEC 5338, so it can be used alongside them.
  es: >-
    Un Modelo de Referencia de Procesos (PRM) para el ciclo de vida de Machine Learning. Siguiendo
    las directrices de ISO/IEC 33004 e ISO/IEC/IEEE 24774, se centra en el grupo de procesos técnicos y especifica cada
    proceso con su propósito, resultados, actividades, entradas y salidas. Mantiene los nombres y la
    estructura de ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, de modo que puede utilizarse
    de forma conjunta.
  ca: >-
    Un Model de Referència de Processos (PRM) per al cicle de vida de Machine Learning. Seguint
    les directrius de ISO/IEC 33004 i ISO/IEC/IEEE 24774, se centra en el grup de processos tècnics i especifica cada
    procés amb el seu propòsit, resultats, activitats, entrades i sortides. Manté els noms i l'estructura
    d'ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, de manera que es pot utilitzar de forma conjunta.
# The doctoral thesis this site is part of.
thesis:
  title: A Process Reference Model for Machine Learning Applications
