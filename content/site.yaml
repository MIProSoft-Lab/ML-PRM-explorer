# The stages of the research that produced the PRM, in order.
timeline:
  - title:
      en: Systematic literature review
      es: Revisión sistemática de la literatura
      ca: Revisió sistemàtica de la literatura
    text:
      en: Collected the ML lifecycle models proposed in academic and industrial sources and extracted the processes that compose them.
      es: Recopilación de los modelos de ciclo de vida de ML propuestos en fuentes académicas e industriales y extracción de los procesos que los componen.
      ca: Recopilació dels models de cicle de vida de ML proposats en fonts acadèmiques i industrials i extracció dels processos que els componen.
  - title:
      en: Comparison with the standards
      es: Comparación con las normas
      ca: Comparació amb les normes
    text:
      en: Mapped those processes against ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 and ISO/IEC 5338, to see where both sources agree and where they differ.
      es: Contraste de esos procesos con ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, para ver dónde coinciden ambas fuentes y dónde difieren.
      ca: Contrast d'aquests processos amb ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, per veure on coincideixen les dues fonts i on difereixen.
  - title:
      en: PRM v1
      es: PRM v1
      ca: PRM v1
    text:
      en: Specified each process with its purpose, outcomes, activities, inputs and outputs, following the guidelines of ISO/IEC 33004 and ISO/IEC/IEEE 24774.
      es: Especificación de cada proceso con su propósito, resultados, actividades, entradas y salidas, siguiendo las directrices de ISO/IEC 33004 e ISO/IEC/IEEE 24774.
      ca: Especificació de cada procés amb el seu propòsit, resultats, activitats, entrades i sortides, seguint les directrius de ISO/IEC 33004 i ISO/IEC/IEEE 24774.
  - title:
      en: Expert workshop
      es: Evaluación con expertos
      ca: Avaluació amb experts
    text:
      en: Practitioners from different areas of the ML lifecycle reviewed the processes of the first version.
      es: Revisión de los procesos de la primera versión con profesionales de distintas áreas del ciclo de vida del ML.
      ca: Revisió dels processos de la primera versió amb professionals de diferents àrees del cicle de vida del ML.
  - title:
      en: PRM v2
      es: PRM v2
      ca: PRM v2
    text:
      en: Refined the processes with the feedback of the workshop. It is the current version of the PRM.
      es: Refinamiento de los procesos con las aportaciones del taller. Es la versión actual del PRM.
      ca: Refinament dels processos amb les aportacions del taller. És la versió actual del PRM.
