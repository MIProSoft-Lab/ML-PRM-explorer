title:
  en: MLProcessMap
  es: MLProcessMap
  ca: MLProcessMap
author: Antonio Crespí Tobeña
institution: Universitat de les Illes Balears
intro:
  en: >-
    A Process Reference Model (PRM) for the Machine Learning lifecycle. Following ISO/IEC 33004 and
    ISO/IEC/IEEE 24774, it focuses on the technical processes group and specifies each process with its
    purpose, outcomes, activities, inputs, and outputs. It keeps the names and structure of ISO/IEC/IEEE
    12207, ISO/IEC/IEEE 15288, and ISO/IEC 5338, so it can be used alongside them.
  es: >-
    Un Modelo de Referencia de Procesos (PRM) para el ciclo de vida del Machine Learning. Siguiendo
    ISO/IEC 33004 e ISO/IEC/IEEE 24774, se centra en el grupo de procesos técnicos y especifica cada
    proceso con su propósito, resultados, actividades, entradas y salidas. Mantiene los nombres y la
    estructura de ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, de modo que puede utilizarse
    junto con ellas.
  ca: >-
    Un Model de Referència de Processos (PRM) per al cicle de vida del Machine Learning. Seguint
    ISO/IEC 33004 i ISO/IEC/IEEE 24774, se centra en el grup de processos tècnics i especifica cada
    procés amb el seu propòsit, resultats, activitats, entrades i sortides. Manté els noms i l'estructura
    d'ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, de manera que es pot utilitzar juntament
    amb elles.
# The doctoral thesis this site is part of.
thesis:
  title: A Process Reference Model for Machine Learning Applications
  year: 2026
  supervisors:
    - Antoni Lluís Mesquida Calafat
# The research group behind the PRM.
group:
  name: MiProSoft
  fullName:
    en: Software Project Improvement and Innovation
    es: Mejora e Innovación en Proyectos de Software
    ca: Millora i Innovació en Projectes de Programari
  description:
    en: >-
      A research group of the Universitat de les Illes Balears that works on software project management,
      software quality, and the assessment and improvement of software processes, including the
      engineering of systems that use artificial intelligence.
    es: >-
      Un grupo de investigación de la Universitat de les Illes Balears que trabaja en la dirección de
      proyectos de software, la calidad del software y la evaluación y mejora de procesos de software,
      incluida la ingeniería de sistemas que utilizan inteligencia artificial.
    ca: >-
      Un grup de recerca de la Universitat de les Illes Balears que treballa en la direcció de projectes
      de programari, la qualitat del programari i l'avaluació i millora de processos de programari,
      inclosa l'enginyeria de sistemes que utilitzen intel·ligència artificial.
  url:
