      ca: Aplicacions de la intel·ligència artificial per a projectes de programari
    - en: Software engineering. Software quality
      es: Ingeniería del software. Calidad del software
      ca: Enginyeria del programari. Qualitat del programari
    - en: Software process assessment and improvement
      es: Evaluación y mejora de procesos de software
      ca: Avaluació i millora de processos de programari
