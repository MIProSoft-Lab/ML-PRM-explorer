id: P19
number: 19
origin: standards-only
name: System Verification Process
purpose: >-
  The purpose of the *System Verification Process* is to provide objective evidence that the integrated
  Machine Learning system fulfills its specified requirements and design before its transition to operation.
  It checks the correctness of the implementation, the interactions between the Machine Learning components
  and the wider software system, and the behavior of the system under load and failure.
outcomes:
- id: a
  text: >-
    A verification strategy defined, with its scope, methods, success criteria, and environment.
- id: b
  text: Correct operation of functional workflows and interfaces verified.
- id: c
  text: Runtime performance verified against the Service Level Objectives.
- id: d
  text: Fault tolerance, fallback, rollback, and recovery mechanisms verified.
- id: e
  text: >-
    Security of the system verified against its security requirements, including the vulnerabilities specific
    to Machine Learning.
- id: f
  text: >-
    Environment and dependencies verified as identified, controlled, and reproducible.
- id: g
  text: Operational readiness of monitoring and versioning established.
- id: h
  text: A System Verification Report documenting verification activities and results.
- id: i
  text: Non-conformances recorded for corrective action and traced to the requirements.
