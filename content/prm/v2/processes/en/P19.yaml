activities:
- id: A1
  title: Prepare verification
  description: >-
    Define the verification strategy and scope from the System Requirements Specification, the Architecture
    Requirements Specification, and the Design Baseline, identifying for each requirement the verification
    method and the expected result, and the constraints that limit what can be verified. Select a controlled
    environment as close as possible to the operational one, without interfering with it, and identify
    the real or synthetic inputs to be used, ensuring that synthetic inputs intended to represent normal
    operation are credible. Automate the verification procedures where possible, so that they can be repeated
    whenever the model, the data, or the code changes, and plan for the test data to be revised as the
    model and its operating conditions evolve.
- id: A2
  title: Verify functional behavior and interfaces
  description: >-
    Test end-to-end workflows to confirm predictions are processed and interpreted correctly, checking
    each system requirement for compliance and testing the interfaces between the model and the APIs,
    databases, and modules it exchanges data with against the Design Baseline. Confirm that the model
    accepts valid inputs, rejects or handles invalid ones without failure, and returns outputs in the
    expected form. Run an automated test that exercises the entire pipeline, confirm that training and
    serving compute the same feature values and that pre- and postprocessing deliver data in the expected
    form, unit test model specification and data preparation code, and review the code written for the
    Machine Learning system. Where the expected output for a given input cannot be determined in advance,
    use relations that must hold between the outputs of related inputs.
- id: A3
  title: Verify performance
  description: >-
    Assess whether the system meets the Service Level Objectives defined in the Architecture Requirements
    Specification, such as latency and throughput, under expected load and under stress conditions, on
    the hardware it will run on. Measure resource consumption and confirm that it remains within the technical
    cost baseline, and compare latency, throughput, and memory usage across versions of code, data, and
    model to detect both sudden and gradual regressions.
  primaryStudies:
  - P8
  - P13
  literature:
  - breckMLTestScore2017
- id: A4
  title: Verify fault tolerance and recovery
  description: >-
    Simulate the failure scenarios relevant to the system, such as unavailable or corrupted data sources,
    unavailable inference, latency spikes, and invalid or extreme inputs resulting from failures elsewhere
    in the system, to confirm that fallback procedures trigger correctly, that the system degrades gracefully,
    and that any mechanism limiting the outputs of the model holds when the model misbehaves. Verify that
    rollback to a previous model version is triggered under the conditions defined for it and completed
    within the expected time, and that the restored model remains compatible with the data, features,
    and components it depends on. Confirm that the recovery procedures in the Disaster Recovery Plan can
    be carried out, and that they are documented so that they do not depend on the knowledge of specific
    individuals.
- id: A5
  title: Verify security
  description: >-
    Scan the integrated system for vulnerabilities and perform penetration tests on it, and test it against
    the attacks specific to Machine Learning identified in the security requirements, such as manipulated
    inputs intended to change its predictions, attempts to extract the model or to reconstruct its training
    data, and the poisoning of data collected for retraining. Confirm that access to the model, its predictions,
    and its training data is restricted as specified.
- id: A6
  title: Verify environment and dependencies
  description: >-
    Verify that the system behaves consistently when deployed in clean, reproducible environments that
    differ from the one in which it was developed. Confirm that its libraries, platforms, and configurations
    are identified, controlled, and approved according to organizational policy, and that changes in them
    can be distinguished from changes in the model itself. Extend these checks to the data dependencies
    of the system, identifying the external signals the model relies on and confirming that their versions
    are controlled.
- id: A7
  title: Verify operational readiness
  description: >-
    Check that monitoring, alerts, and version control are configured correctly. Confirm that telemetry,
    dashboards, access control, logging, and auditability are in place, and that each deployed model can
    be identified together with the data used to build and test it.
  literature:
  - ISO5338
- id: A8
  title: Document verification results
  description: >-
    Record in the System Verification Report the verification strategy, the tests performed, their results,
    the anomalies encountered, and the limitations and assumptions of the verification, using the Reporting
    Templates so that successive verifications remain comparable. Describe each non-conformance with enough
    information for the process where it originated to address it, track its resolution, confirm that
    the verification criteria have been met, and maintain traceability between the verification results
    and the requirements and design elements they refer to.
  literature:
  - ISO12207
