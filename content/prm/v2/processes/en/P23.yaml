id: P23
number: 23
origin: standards-only
name: Operation Process
purpose: >-
  The purpose of the *Operation Process* is to use the Machine Learning system in production to deliver
  its services. It keeps the system available within agreed service levels, manages the people and resources
  needed to run it, and handles the incidents and support requests that arise during use.
outcomes:
- id: a
  text: >-
    An operation strategy defined, with enabling systems and qualified operators available.
- id: b
  text: >-
    The system used in its operational environment, serving predictions in the established mode.
- id: c
  text: Runtime resources managed against cost and performance objectives.
- id: d
  text: Production data and serving payloads captured and governed for downstream reuse.
- id: e
  text: >-
    Operational procedures and contingency measures applied under degraded conditions.
- id: f
  text: >-
    Incidents and support requests recorded, tracked, and escalated when a change is needed.
- id: g
  text: >-
    Operation records produced and traced to requirements and architectural decisions.
