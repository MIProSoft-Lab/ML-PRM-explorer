id: P25
number: 25
origin: standards-only
name: Disposal Process
purpose: >-
  The purpose of the *Disposal Process* is to define the activities for when a Machine Learning system,
  or any of its components, reaches the end of its life. It manages the orderly removal of the retired
  components from production while ensuring traceability, compliance, and the preservation of knowledge.
outcomes:
- id: a
  text: Identified and documented decommissioning triggers and scope.
- id: b
  text: Securely deactivated components, prediction services, and infrastructure.
- id: c
  text: Archived or securely deleted components and artifacts according to policy.
- id: d
  text: Preserved provenance metadata and logs for auditability.
- id: e
  text: Retained documentation and artifacts for future reproducibility.
- id: f
  text: Released resources and concluded technical ownership.
