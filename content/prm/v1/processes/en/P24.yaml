id: P24
number: 24
origin: standards-and-literature
name: Maintenance Process
purpose: >-
  The purpose of the *Maintenance Process* is to sustain the capability of the Machine Learning system
  to provide its service. It analyzes reported deviations and takes the corrective, adaptive, perfective,
  and preventive actions needed, including retraining, coordinating the work through the data, model,
  and transition processes.
outcomes:
- id: a
  text: A maintenance strategy defined as an annex to the architecture documentation.
- id: b
  text: Maintenance needs classified and attributed to the data, the model, or the code.
- id: c
  text: Impact of each change assessed before implementation.
- id: d
  text: >-
    Operational capability restored after failure through rollback, fallback, or degraded operation.
- id: e
  text: Changes implemented, including retraining or continuous learning of the model.
- id: f
  text: >-
    Changes regression tested and revised models assessed against the original evaluation framework.
- id: g
  text: Restored capability confirmed against the indicators that triggered the change.
- id: h
  text: >-
    Maintenance records and trends linking each action to the affected elements and model lineage.
inputs:
- workProduct: maintenance-requests
  name: Maintenance Requests
  description: Issues escalated from operation that need a change.
  serves:
  - b
  - c
- workProduct: monitoring-records
  name: Monitoring Records
  description: Drift and performance evidence.
  serves:
  - b
  - g
- workProduct: integrated-system
  name: Integrated System
  description: The system whose capability is sustained.
  serves:
  - c
  - d
  - e
- workProduct: system-architecture-documentation
