id: P19
number: 19
origin: standards-only
name: System Verification Process
purpose: >-
  The purpose of the *System Verification Process* is to confirm that the complete ML-enabled system meets
  all requirements and design intent. It checks the correctness of the implementation and the interactions
  between the ML component and the wider software system.
outcomes:
- id: a
  text: Verified correct operation under functional workflows.
- id: b
  text: Tested interfaces between the ML component and system modules.
- id: c
  text: Evaluated runtime performance against operational thresholds.
- id: d
  text: Verified fault tolerance and fallback mechanisms.
- id: e
  text: Established operational readiness of monitoring and versioning.
- id: f
  text: >-
    Documented verification activities and results in the System Verification Report.
- id: g
  text: Recorded non-conformances for corrective action.
inputs:
- workProduct: integrated-system
  name: Integrated System
  description: The complete application with the model embedded.
  serves:
  - a
  - b
  - c
  - d
  - e
- workProduct: system-requirements-specification
  name: System Requirements Specification
  description: The requirements the system is verified against.
  serves:
  - a
  - b
  - c
outputs:
- workProduct: system-verification-report
  name: System Verification Report
  description: >-
    The results of functional, performance, fault tolerance, and operational readiness verification, and
    the non-conformances found.
  serves:
  - a
  - b
  - c
  - d
  - e
  - f
  - g
activities:
- id: A1
  title: Verify functional workflows
  description: >-
    Test end-to-end workflows to confirm predictions are processed and interpreted correctly, testing
    the interfaces between the model and the APIs, databases, and modules it exchanges data with, and
    checking each system requirement for compliance. Run an automated test that exercises the entire pipeline,
    confirm that training and serving compute the same feature values and that pre- and postprocessing
    deliver data in the expected form, unit test model specification and data preparation code, and review
    the code written for the AI system.
  literature:
  - breckMLTestScore2017
  - sensLargeScaleStudyModel2025
- id: A2
  title: Verify performance
  description: >-
    Assess whether the system meets constraints such as latency and throughput under stress conditions,
    on the hardware it will run on, checking for regressions in serving latency, throughput, and memory
    usage.
  primaryStudies:
  - P8
  - P13
  literature:
  - breckMLTestScore2017
- id: A3
  title: Verify fault tolerance
  description: >-
    Simulate failures to confirm that fallback procedures trigger correctly, covering missing or corrupted
    input data, unavailable inference, and latency spikes. Also verify the system capability to roll back
    to a previous model version.
  primaryStudies:
  - P3
  - P6
  literature:
  - polletiHierarchicalFallbackArchitecture2025
  - breckMLTestScore2017
- id: A4
  title: Verify operational readiness
  description: >-
    Check that monitoring, alerts, and version control are configured correctly. Confirm that telemetry,
    dashboards, access control, logging, and auditability are in place, and that each deployed model can
    be identified together with the data used to build and test it.
  literature:
  - ISO5338
- id: A5
  title: Document verification results
  description: >-
    Record test results, monitoring logs, and non-conformances in the System Verification Report to support
    maintenance and corrective action, tracking the resolution of incidents, obtaining stakeholder agreement
    that the verification criteria have been met, and maintaining traceability to the requirements.
  literature:
  - ISO12207
standards:
- standard: ISO/IEC/IEEE 12207
  activity: b) Perform verification
  standardProcess: Verification Process
- standard: ISO/IEC/IEEE 12207
  activity: c) Manage results of verification
  standardProcess: Verification Process
- standard: ISO/IEC 5338
  activity: Verification through review
  standardProcess: Verification Process particularities
